name: Publish Storybook Svelte Next Web Site

env:
  gha-branch: next
  gha-production: true
  gha-domain: ${{ secrets.DOMAIN_STORYBOOK_SVELTE }}

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"twin","labels":"self-hosted"}') || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.gha-branch }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Install older version of Vercel CLI until this issue is fixed
      # https://github.com/BetaHuhn/deploy-to-vercel-action/issues/393
      - name: Install Vercel CLI
        run: npm install -g vercel@22.0.1

      - name: Deploy to Vercel
        uses: BetaHuhn/deploy-to-vercel-action@v1.10.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TWIN_VERCEL_TOKEN: ${{ secrets.TWIN_VERCEL_TOKEN }}
          TWIN_VERCEL_ORG_ID: ${{ secrets.TWIN_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_STORYBOOK_SVELTE }}
          TWIN_VERCEL_SCOPE: ${{ secrets.TWIN_VERCEL_SCOPE }}
          ALIAS_DOMAINS: ${{ env.gha-domain }}
          PRODUCTION: ${{ env.gha-production }}
          WORKING_DIRECTORY: packages/ui-components-svelte
          FORCE: true
